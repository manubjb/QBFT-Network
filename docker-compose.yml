services:
  node1:
    image: hyperledger/besu:latest
    container_name: qbft-node1
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,DEBUG,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --p2p-host=node1
      - --p2p-port=30303
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
      - ./Node-1/data:/opt/besu/data
    ports:
      - "8545:8545"
      - "9545:9545"
      - "30303:30303"
    networks:
      - qbft-net

  node2:
    image: hyperledger/besu:latest
    container_name: qbft-node2
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --bootnodes=enode://COLE_AQUI_O_ENODE_DO_NODE1@node1:30303
      - --p2p-host=node2
      - --p2p-port=30303
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,DEBUG,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
      - ./Node-2/data:/opt/besu/data
    ports:
      - "8546:8545"
      - "9546:9545"
      - "30304:30303"
    depends_on:
      - node1
    networks:
      - qbft-net

  node3:
    image: hyperledger/besu:latest
    container_name: qbft-node3
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --bootnodes=enode://COLE_AQUI_O_ENODE_DO_NODE1@node1:30303
      - --p2p-host=node3
      - --p2p-port=30303
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,DEBUG,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
      - ./Node-3/data:/opt/besu/data
    ports:
      - "8547:8545"
      - "9547:9545"
      - "30305:30303"
    depends_on:
      - node1
    networks:
      - qbft-net

  node4:
    image: hyperledger/besu:latest
    container_name: qbft-node4
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --bootnodes=enode://COLE_AQUI_O_ENODE_DO_NODE1@node1:30303
      - --p2p-host=node4
      - --p2p-port=30303
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,DEBUG,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --metrics-enabled=true
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
      - ./Node-4/data:/opt/besu/data
    ports:
      - "8548:8545"
      - "9548:9545"
      - "30306:30303"
    depends_on:
      - node1
    networks:
      - qbft-net

networks:
  qbft-net:
    driver: bridge